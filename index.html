    <script>
      (function () {
        var root = document.documentElement;
        root.classList.replace('no-js', 'js');
        var theme = 'dark';
        var lang = 'zh';
        var motion = 'full';
        try {
          var saved = JSON.parse(localStorage.getItem('stmfan.sublunary') || '{}');
          if (saved.theme === 'light' || saved.theme === 'dark') theme = saved.theme;
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
          if (saved.lang === 'zh' || saved.lang === 'en') lang = saved.lang;
          else if (!/^zh/i.test(navigator.language || 'zh')) lang = 'en';
          if (saved.motion === 'calm') motion = 'calm';
        } catch (e) {}
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) motion = 'calm';
        root.dataset.theme = theme;
        root.dataset.lang = lang;
        root.dataset.motion = motion;
        root.lang = lang === 'en' ? 'en' : 'zh-CN';
        root.style.setProperty('--vh', window.innerHeight * 0.01 + 'px');
      })();
    </script>
